name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/voorz/openwrt
  BRANCH: main
  TARGET: rockchip
  SUBTARGET: armv8
  DEVICE: nlnet_xiguapi-v3

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3-distutils python3-ply python3-pyelftools

      - name: Clone source
        run: |
          git clone --depth 1 --branch $BRANCH $REPO_URL openwrt-src
          cd openwrt-src
          git branch
          git log --oneline -1

      - name: Update feeds
        run: |
          cd openwrt-src
          # Use feeds.conf (includes nikki feed, skips video feed)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Remove packages with recursive dependency bugs in upstream
          rm -f package/feeds/luci/luci-app-weechat/Makefile
          rm -f package/feeds/packages/weechat-full/Makefile
          rm -f package/feeds/packages/weechat-minimal/Makefile
          rm -f package/feeds/packages/squeezelite/Makefile
          # Also remove any squeezelite-custom references
          find package/feeds/ -path '*squeezelite*' -delete 2>/dev/null || true

      - name: Load custom config
        run: |
          cd openwrt-src
          cp $GITHUB_WORKSPACE/.config .config
          # Pre-configure custom APK feeds pointing to GitHub Release
          mkdir -p files/etc/apk/repositories.d
          cat > files/etc/apk/repositories.d/customfeeds.list << 'FEEDS'
          https://github.com/voorz/openwrt-packages/releases/latest/download/packages.adb
          FEEDS
          # Run defconfig non-interactively (CI has no terminal)
          export TERM=dumb
          make defconfig || true
          # Run defconfig again to ensure config is stable
          make defconfig
          # Verify target is correct
          grep CONFIG_TARGET_rockchip .config || { echo "ERROR: target not set to rockchip!"; exit 1; }

      - name: Download packages
        run: |
          cd openwrt-src
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: Compile firmware
        run: |
          cd openwrt-src
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "BUILD_STATUS=success" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +"%m.%d.%Y")" >> $GITHUB_ENV

      - name: Organize output files
        if: env.BUILD_STATUS == 'success'
        run: |
          # Verify and set firmware path
          if [ -d openwrt-src/bin/targets/rockchip/armv8 ]; then
            cd openwrt-src/bin/targets/rockchip/armv8
          else
            echo "ERROR: rockchip/armv8 target directory not found!"
            ls -la openwrt-src/bin/targets/*/  2>/dev/null
            exit 1
          fi
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          TAG_VERSION=$(echo $GITHUB_REF_NAME | sed 's/^v//; s/\.//g')
          # For rockchip/armv8, the firmware file naming is:
          # openwrt-rockchip-armv8-nlnet_xiguapi-v3-squashfs-sysupgrade.bin
          OLD_NAME=$(ls openwrt-rockchip-armv8-nlnet_xiguapi-v3-*-squashfs-sysupgrade.bin 2>/dev/null | head -1)
          NEW_NAME="openwrt-rockchip-armv8-nlnet_xiguapi-v3-voorz_v${TAG_VERSION}-squashfs-sysupgrade.bin"
          if [ -n "$OLD_NAME" ] && [ "$OLD_NAME" != "$NEW_NAME" ]; then
            mv "$OLD_NAME" "$NEW_NAME"
          fi
          ls -la *.bin 2>/dev/null || echo "No firmware bin files found"

      - name: Generate package index for APK repository
        if: env.BUILD_STATUS == 'success'
        run: |
          cd openwrt-src
          mkdir -p /tmp/apk-repo
          # Collect all .apk files into a single flat directory
          find bin/packages/ -name '*.apk' -exec cp {} /tmp/apk-repo/ \;
          find bin/targets/ -name '*.apk' -exec cp {} /tmp/apk-repo/ \;
          # DO NOT copy firmware .bin into apk-repo (causes index errors)
          # Generate single combined index
          APK_TOOLS=$(find /home/runner/work/openwrt/openwrt/openwrt-src/staging_dir/host/bin -name 'apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK_TOOLS" ]; then
            APK_TOOLS=$(find /home/runner/work/openwrt/openwrt/openwrt-src/staging_dir -name 'apk' -type f 2>/dev/null | head -1)
          fi
          cd /tmp/apk-repo
          if [ -n "$APK_TOOLS" ] && ls *.apk >/dev/null 2>&1; then
            $APK_TOOLS index --allow-untrusted --output packages.adb *.apk || echo "WARNING: apk index failed, continuing anyway"
            echo "Generated packages.adb using $APK_TOOLS"
          else
            echo "WARNING: No apk tool or no apk files found, skipping index"
          fi
          ls -la packages.adb 2>/dev/null || echo "WARNING: packages.adb not found"
          echo "Total packages: $(ls /tmp/apk-repo/*.apk 2>/dev/null | wc -l)"
          echo "APK_REPO=/tmp/apk-repo" >> $GITHUB_ENV
          # Also set firmware file path for upload
          FIRMWARE_BIN=$(ls $FIRMWARE/openwrt-rockchip-armv8-nlnet_xiguapi-v3-*-squashfs-sysupgrade.bin 2>/dev/null | head -1)
          if [ -n "$FIRMWARE_BIN" ]; then
            echo "FIRMWARE_BIN=$FIRMWARE_BIN" >> $GITHUB_ENV
            echo "Found firmware: $FIRMWARE_BIN"
          else
            echo "WARNING: No firmware bin found!"
            ls -la $FIRMWARE/*.bin 2>/dev/null || true
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: env.BUILD_STATUS == 'success'
        with:
          name: OpenWrt firmware ${{ env.DEVICE }} ${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.BUILD_STATUS == 'success'
        run: |
          echo "RELEASE_TAG=openwrt-$(date +"%Y%m%d")-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: always() && env.BUILD_STATUS == 'success' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenWrt ${{ github.ref_name }}
          body: |
            ## OpenWrt Firmware
            
            **Device**: XiGuaPi V3 (NLnet)
            **Platform**: Rockchip RK3568 (rockchip/armv8)
            **Build Date**: ${{ env.BUILD_DATE }}
            
            ### Firmware Features
            - LuCI Web Interface
            - Argon theme + Chinese language pack
            - GC9307 SPI Screen support
            - MT7922 WiFi (2.4G/5G/6G)
            - USB 5G module support (QMI)
            - Docker support
            
            ### Installation
            1. Access router admin panel at http://10.1.1.1
            2. Navigate to System → Backup/Flash Firmware
            3. Upload the sysupgrade.bin file
            4. Wait for the router to reboot
            
            ### Package Repository
            APK packages are available at: https://github.com/voorz/openwrt-packages/releases
          files: |
            ${{ env.FIRMWARE_BIN }}
          draft: false
          prerelease: false

      - name: Upload APK packages to packages repo
        if: always() && env.BUILD_STATUS == 'success' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Upload APK packages to the same release
          if [ -d "${{ env.APK_REPO }}" ]; then
            gh release upload ${{ github.ref_name }} ${{ env.APK_REPO }}/*.apk ${{ env.APK_REPO }}/packages.adb 2>/dev/null || true
          else
            echo "WARNING: APK_REPO not set, skipping APK upload"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure releases are published
        if: always() && env.BUILD_STATUS == 'success' && startsWith(github.ref, 'refs/tags/')
        run: |
          gh release edit ${{ github.ref_name }} --draft=false --prerelease=false
        env:
          GH_TOKEN: ${{ github.token }}
