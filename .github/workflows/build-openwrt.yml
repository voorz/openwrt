name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/voorz/openwrt
  BRANCH: main
  TARGET: rockchip
  SUBTARGET: armv8
  DEVICE: nlnet_xiguapi-v3

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3-distutils python3-ply python3-pyelftools

      - name: Clone source
        run: |
          git clone --depth 1 --branch $BRANCH $REPO_URL openwrt-src
          cd openwrt-src
          git branch
          git log --oneline -1

      - name: Update feeds
        run: |
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Remove packages with recursive dependency bugs in upstream
          rm -f package/feeds/luci/luci-app-weechat/Makefile
          rm -f package/feeds/packages/weechat-full/Makefile
          rm -f package/feeds/packages/weechat-minimal/Makefile
          rm -f package/feeds/packages/squeezelite/Makefile
          find package/feeds/ -path '*squeezelite*' -delete 2>/dev/null || true

      - name: Load custom config
        run: |
          cd openwrt-src
          cp $GITHUB_WORKSPACE/.config .config
          # Run defconfig non-interactively (CI has no terminal)
          export TERM=dumb
          make defconfig || true
          # Run defconfig again to ensure config is stable
          make defconfig
          # Verify target is correct
          grep CONFIG_TARGET_rockchip .config || { echo "ERROR: target not set to rockchip!"; exit 1; }
          # Verify APK is disabled
          grep -q 'CONFIG_USE_APK=y' .config && { echo "ERROR: CONFIG_USE_APK is enabled, will cause build failures!"; exit 1; } || echo "OK: APK is disabled, using OPKG"

      - name: Download packages
        run: |
          cd openwrt-src
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: Compile firmware
        run: |
          cd openwrt-src
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "BUILD_STATUS=success" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +"%m.%d.%Y")" >> $GITHUB_ENV

      - name: Collect build outputs
        if: env.BUILD_STATUS == 'success'
        run: |
          # Set firmware directory
          FIRMWARE_DIR="openwrt-src/bin/targets/rockchip/armv8"
          if [ ! -d "$FIRMWARE_DIR" ]; then
            echo "ERROR: rockchip/armv8 target directory not found!"
            ls -la openwrt-src/bin/targets/*/  2>/dev/null
            exit 1
          fi
          echo "FIRMWARE=$GITHUB_WORKSPACE/$FIRMWARE_DIR" >> $GITHUB_ENV

          echo "=== All files in target directory ==="
          ls -la "$FIRMWARE_DIR/"

          # Find sysupgrade bin (try multiple patterns)
          FIRMWARE_BIN=""
          for pattern in \
            "openwrt-rockchip-armv8-nlnet_xiguapi-v3-*-squashfs-sysupgrade.bin" \
            "openwrt-rockchip-armv8-*-squashfs-sysupgrade.bin" \
            "*-squashfs-sysupgrade.bin"; do
            FIRMWARE_BIN=$(ls "$FIRMWARE_DIR"/$pattern 2>/dev/null | head -1)
            if [ -n "$FIRMWARE_BIN" ]; then
              echo "Found firmware with pattern: $pattern"
              break
            fi
          done

          # Rename firmware with version tag
          TAG_VERSION=$(echo $GITHUB_REF_NAME | sed 's/^v//; s/\.//g')
          if [ -n "$FIRMWARE_BIN" ]; then
            BASENAME=$(basename "$FIRMWARE_BIN")
            NEW_NAME="openwrt-rockchip-armv8-nlnet_xiguapi-v3-voorz_v${TAG_VERSION}-squashfs-sysupgrade.bin"
            if [ "$BASENAME" != "$NEW_NAME" ]; then
              mv "$FIRMWARE_BIN" "$FIRMWARE_DIR/$NEW_NAME"
              FIRMWARE_BIN="$FIRMWARE_DIR/$NEW_NAME"
            fi
            echo "FIRMWARE_BIN=$FIRMWARE_BIN" >> $GITHUB_ENV
            echo "Firmware file: $FIRMWARE_BIN"
          else
            echo "WARNING: No sysupgrade.bin found!"
            echo "=== All .bin and .img files ==="
            find "$FIRMWARE_DIR" -name '*.bin' -o -name '*.img' 2>/dev/null || true
          fi

          # Find factory bin (for first-flash)
          FACTORY_BIN=$(ls "$FIRMWARE_DIR"/openwrt-rockchip-armv8-nlnet_xiguapi-v3-*-squashfs-factory.bin 2>/dev/null | head -1 || ls "$FIRMWARE_DIR"/openwrt-rockchip-armv8-*-squashfs-factory.bin 2>/dev/null | head -1 || true)
          if [ -n "$FACTORY_BIN" ]; then
            echo "FACTORY_BIN=$FACTORY_BIN" >> $GITHUB_ENV
            echo "Factory image: $FACTORY_BIN"
          fi

          # Collect IPK packages (OPKG format, not APK)
          mkdir -p /tmp/ipk-repo
          find openwrt-src/bin/packages/ -name '*.ipk' -exec cp {} /tmp/ipk-repo/ \; 2>/dev/null || true
          find openwrt-src/bin/targets/ -name '*.ipk' -exec cp {} /tmp/ipk-repo/ \; 2>/dev/null || true
          # Also collect any .apk files if present
          find openwrt-src/bin/packages/ -name '*.apk' -exec cp {} /tmp/ipk-repo/ \; 2>/dev/null || true
          find openwrt-src/bin/targets/ -name '*.apk' -exec cp {} /tmp/ipk-repo/ \; 2>/dev/null || true
          echo "IPK_REPO=/tmp/ipk-repo" >> $GITHUB_ENV
          echo "Total packages: $(ls /tmp/ipk-repo/*.{ipk,apk} 2>/dev/null | wc -l)"

          # Generate Packages.gz index for opkg
          if ls /tmp/ipk-repo/*.ipk >/dev/null 2>&1; then
            (cd /tmp/ipk-repo && for f in *.ipk; do
              ar p "$f" control.tar.gz | tar xzO ./control 2>/dev/null
              echo ""
              echo "Filename: $f"
              echo "Size: $(stat -c%s "$f")"
              echo "MD5Sum: $(md5sum "$f" | cut -d' ' -f1)"
            done > Packages && gzip -kf Packages)
            echo "Generated Packages.gz index"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: env.BUILD_STATUS == 'success'
        with:
          name: OpenWrt firmware ${{ env.DEVICE }} ${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload to GitHub Release
        if: always() && env.BUILD_STATUS == 'success' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Upload firmware bin
          if [ -n "${{ env.FIRMWARE_BIN }}" ] && [ -f "${{ env.FIRMWARE_BIN }}" ]; then
            gh release upload "${{ github.ref_name }}" "${{ env.FIRMWARE_BIN }}" --clobber
            echo "Uploaded firmware: ${{ env.FIRMWARE_BIN }}"
          else
            echo "WARNING: No firmware bin to upload!"
          fi

          # Upload factory bin if exists
          if [ -n "${{ env.FACTORY_BIN }}" ] && [ -f "${{ env.FACTORY_BIN }}" ]; then
            gh release upload "${{ github.ref_name }}" "${{ env.FACTORY_BIN }}" --clobber
            echo "Uploaded factory image: ${{ env.FACTORY_BIN }}"
          fi

          # Upload IPK packages (batch to avoid too many args)
          if [ -d "${{ env.IPK_REPO }}" ]; then
            cd "${{ env.IPK_REPO }}"
            # Upload Packages.gz index
            if [ -f Packages.gz ]; then
              gh release upload "${{ github.ref_name }}" Packages.gz --clobber
              echo "Uploaded Packages.gz index"
            fi
            # Upload IPKs in batches
            ls *.ipk 2>/dev/null | xargs -n50 gh release upload "${{ github.ref_name }}" --clobber || true
            echo "Uploaded IPK packages"
          fi

          # Ensure release is published (not draft)
          gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false \
            --title "OpenWrt ${{ github.ref_name }}" \
            --notes "## OpenWrt Firmware

          **Device**: XiGuaPi V3 (NLnet)
          **Platform**: Rockchip RK3568 (rockchip/armv8)
          **Build Date**: ${{ env.BUILD_DATE }}

          ### Firmware Features
          - LuCI Web Interface
          - Argon theme + Chinese language pack
          - GC9307 SPI Screen support
          - MT7922 WiFi (2.4G/5G/6G)
          - Docker support

          ### Installation
          1. Access router admin panel at http://10.1.1.1
          2. Navigate to System -> Backup/Flash Firmware
          3. Upload the sysupgrade.bin file
          4. Wait for the router to reboot"
        env:
          GH_TOKEN: ${{ github.token }}
