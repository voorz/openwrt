name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  BRANCH: main
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: cudy_tr3000-256mb-v1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3-distutils python3-ply python3-pyelftools

      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt-src
          cd openwrt-src
          git branch

      - name: Update feeds
        run: |
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cd openwrt-src
          [ -e $GITHUB_WORKSPACE/.config ] && cp $GITHUB_WORKSPACE/.config .config || make menuconfig DEFCONFIG=1
          # Pre-configure custom APK feeds pointing to GitHub Release
          mkdir -p files/etc/apk/repositories.d
          cat > files/etc/apk/repositories.d/customfeeds.list << 'FEEDS'
          https://github.com/voorz/openwrt/releases/latest/download/targets/mediatek/filogic/packages/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/base/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/luci/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/packages/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/routing/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/telephony/packages.adb
          https://github.com/voorz/openwrt/releases/latest/download/packages/aarch64_cortex-a53/video/packages.adb
          FEEDS
          make defconfig

      - name: Download packages
        run: |
          cd openwrt-src
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: Compile firmware
        run: |
          cd openwrt-src
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "BUILD_STATUS=success" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +"%m.%d.%Y")" >> $GITHUB_ENV

      - name: Organize output files
        if: env.BUILD_STATUS == 'success'
        run: |
          cd openwrt-src/bin/targets/*/*
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          TAG_VERSION=$(echo $GITHUB_REF_NAME | sed 's/^v//; s/\.//g')
          OLD_NAME=$(ls openwrt-mediatek-filogic-cudy_tr3000-256mb-*-squashfs-sysupgrade.bin 2>/dev/null | head -1)
          NEW_NAME="openwrt-mediatek-filogic-cudy_tr3000-256mb-voorz_v${TAG_VERSION}-squashfs-sysupgrade.bin"
          if [ -n "$OLD_NAME" ] && [ "$OLD_NAME" != "$NEW_NAME" ]; then
            mv "$OLD_NAME" "$NEW_NAME"
          fi

      - name: Generate package index for APK repository
        if: env.BUILD_STATUS == 'success'
        run: |
          cd openwrt-src
          ARCH_PACKAGES=$(ls bin/packages/)
          for dir in bin/packages/$ARCH_PACKAGES/*/; do
            feed=$(basename $dir)
            mkdir -p $dir
            # Generate APK index for each feed
            (cd $dir && apk-tools index --output packages.adb *.apk 2>/dev/null || true)
            echo "Generated index for feed: $feed"
          done
          # Also index target packages
          for dir in bin/targets/*/*/packages/; do
            if [ -d "$dir" ]; then
              (cd $dir && apk-tools index --output packages.adb *.apk 2>/dev/null || true)
              echo "Generated index for target packages"
            fi
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: env.BUILD_STATUS == 'success'
        with:
          name: OpenWrt firmware ${{ env.DEVICE }} ${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.BUILD_STATUS == 'success'
        run: |
          echo "RELEASE_TAG=openwrt-$(date +"%Y%m%d")-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: env.BUILD_STATUS == 'success' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenWrt ${{ github.ref_name }}
          body: |
            ## OpenWrt Firmware
            
            **Device**: Cudy TR3000 256MB v1
            **Platform**: MediaTek Filogic (mediatek/filogic)
            **Build Date**: ${{ env.BUILD_DATE }}
            
            ### Firmware Features
            - LuCI Web Interface
            - Argon theme + Chinese language pack
            - Basic networking functionality
            
            ### Installation
            1. Access router admin panel at http://10.0.0.1
            2. Navigate to System → Backup/Flash Firmware
            3. Upload the sysupgrade.bin file
            4. Wait for the router to reboot
            
            ### Package Repository
            APK packages are included in this release.
            Add the following to `/etc/apk/repositories.d/customfeeds.list` on the router:
            
            ```
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/targets/mediatek/filogic/packages/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/base/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/luci/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/packages/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/routing/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/telephony/packages.adb
            https://github.com/voorz/openwrt/releases/download/${{ github.ref_name }}/packages/aarch64_cortex-a53/video/packages.adb
            ```
          files: |
            ${{ env.FIRMWARE }}/openwrt-mediatek-filogic-cudy_tr3000-256mb-voorz_v*.squashfs-sysupgrade.bin
            openwrt-src/bin/packages/aarch64_cortex-a53/base/*
            openwrt-src/bin/packages/aarch64_cortex-a53/luci/*
            openwrt-src/bin/packages/aarch64_cortex-a53/packages/*
            openwrt-src/bin/packages/aarch64_cortex-a53/routing/*
            openwrt-src/bin/packages/aarch64_cortex-a53/telephony/*
            openwrt-src/bin/packages/aarch64_cortex-a53/video/*
            openwrt-src/bin/targets/mediatek/filogic/packages/*
          draft: false
          prerelease: false
